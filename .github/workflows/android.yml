name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'src/**', 'styles/**', 'index.html', 'capacitor.config.json', 'package*.json', 'tools/android-prepare.cjs', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run android:prepare
      - name: Compilar APK de prueba
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Preparar descarga
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Control-de-inventarios-1.4.3-prueba.apk
          sha256sum apk/*.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Control-de-inventarios-Android
          path: apk/
          retention-days: 90
          if-no-files-found: error
